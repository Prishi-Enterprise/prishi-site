<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Trading Lab market research illustration</title>
  <desc id="description">A dark analytical grid with an upward price line, measured risk band, and highlighted decision point.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a24"/>
      <stop offset="1" stop-color="#1c3040"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4f98a" stop-opacity=".32"/>
      <stop offset="1" stop-color="#d4f98a" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#background)"/>
  <g stroke="#8093a3" stroke-opacity=".18" stroke-width="1">
    <path d="M0 120h1200M0 240h1200M0 360h1200M0 480h1200M0 600h1200M0 720h1200"/>
    <path d="M120 0v800M300 0v800M480 0v800M660 0v800M840 0v800M1020 0v800"/>
  </g>
  <path d="M70 620 C160 592 218 642 300 564 S450 520 520 466 S654 498 720 392 S842 330 910 356 S1038 276 1130 194 L1130 720 L70 720Z" fill="url(#area)"/>
  <path d="M70 620 C160 592 218 642 300 564 S450 520 520 466 S654 498 720 392 S842 330 910 356 S1038 276 1130 194" fill="none" stroke="#d4f98a" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M70 675H1130" stroke="#ff8d78" stroke-width="3" stroke-dasharray="14 14" opacity=".78"/>
  <circle cx="720" cy="392" r="13" fill="#d4f98a"/>
  <circle cx="720" cy="392" r="31" fill="none" stroke="#d4f98a" stroke-width="2" opacity=".55"/>
  <g fill="#eaf2f6" font-family="Inter,Arial,sans-serif">
    <text x="70" y="88" font-size="24" letter-spacing="5" opacity=".78">PAPER MARKET STUDY</text>
    <text x="70" y="142" font-size="54" font-weight="600">Measure before action.</text>
    <text x="70" y="766" font-size="18" letter-spacing="3" opacity=".72">₹28K SIMULATED CAPITAL  /  ₹250 PLANNED RISK</text>
  </g>
</svg>
